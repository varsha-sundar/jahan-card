<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jahan · Product Wrapped</title>
    <meta
      name="description"
      content="A Spotify Wrapped–style farewell for Jahan — Product to Delivery Ops at Via."
    />
    <meta property="og:title" content="Jahan · Product Wrapped" />
    <meta
      property="og:description"
      content="Highlights and notes from the Product team. Serve over HTTP to load messages and photos."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Photos: team-source.txt · Notes: embedded-notes.js -->
    <div class="noise" aria-hidden="true"></div>
    <div class="glow-orbs" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
    </div>

    <header class="top-bar">
      <span class="top-bar__label" data-bind="topBarLeft"></span>
      <span class="top-bar__year" data-bind="topBarRight"></span>
    </header>

    <main class="wrap" id="main">
      <section class="panel panel--hero" data-theme="violet">
        <h1 class="hero-title hero-title--unwrap" id="heroTitle"></h1>
        <p class="lede reveal" style="--d: 0.35s" data-bind="heroLede"></p>
        <div class="scroll-hint reveal" style="--d: 0.52s" aria-hidden="true">
          <span>Scroll to see more</span>
          <span class="scroll-hint__chev"></span>
        </div>
      </section>

      <section class="panel panel--photos" data-theme="mint" aria-label="Team photos">
        <div class="photo-grid photo-grid--open" id="photoGrid"></div>
      </section>

      <section
        class="panel panel--notes panel--team-notes"
        id="teamNotesPanel"
        data-theme="rose"
        aria-labelledby="teamNotesHeading"
      >
        <div class="team-notes-shell">
          <header class="notes-head">
            <p class="eyebrow" id="teamNotesHeading">From the team</p>
          </header>
          <div class="notes-letters" id="notesLetters" aria-label="Notes from teammates"></div>
        </div>
      </section>

      <section class="panel panel--finale" data-theme="violet">
        <p class="finale-lede reveal" style="--d: 0.08s" data-bind="finaleLede"></p>
        <button type="button" class="confetti-btn reveal" style="--d: 0.28s" id="confettiBtn"></button>
        <p class="finale-tag reveal" style="--d: 0.42s" data-bind="finaleSignoff"></p>
        <p class="finale-credit reveal" style="--d: 0.56s" data-bind="creditLine" hidden></p>
      </section>
    </main>

    <canvas id="confetti" class="confetti-canvas" aria-hidden="true"></canvas>

    <script src="embedded-notes.js"></script>
    <script>
      (function () {
        "use strict";

        /** Change if your notes/photos live in another file. */
        var TEAM_SRC = "team-source.txt";

        var PAGE = {
          pageTitle: "Jahan · Product Wrapped ✨",
          topBar: { left: "Via · Product → Delivery Ops 👑", right: "Your Product era · wrapped ✨" },
          heroTitleHtml:
            '<span class="reveal" style="--d: 0.06s"><span class="hero-heading-primary">Jahan\u2019s product chapter unwrapped ✨</span></span>',
          heroLede:
            "Your Product chapter deserves a proper send-off. Congrats on leading Delivery Ops — here's to all your amazing work on the VOC!",
          stats: [
            {
              rank: "Wrapped #1 ✨",
              label: "Product features shipped",
              value: { kind: "count", count: 24 },
              suffix:
                "From bookings to payments to Voice AI to error-copy fixes — you made a mark across the board",
              footnote: "",
            },
            {
              rank: "Wrapped #2 👑",
              label: "VPDs you created",
              value: { kind: "count", count: 55 },
              suffix:
                "You were great at finding the product problems that mattered, understanding what users actually needed, and putting it all on paper.",
              footnote: "",
            },
            {
              rank: "Wrapped #3 💬",
              label: "Slack channels you lived in",
              value: { kind: "count", count: 41 },
              suffix: "channels with approximately a million messages each — and you still kept up. Icon behavior. ✨",
              footnote: "",
            },
          ],
          finale: {
            lede:
              "We miss you in Product — and we are so glad you are still at Via in Delivery Ops. Thank you for helping everyone feel set up for success, all the way through (and beyond). We cannot wait to cheer you on. ✨👑",
            buttonLabel: "One more confetti cannon ✨",
            signoff: "With gratitude · Product team 👑",
          },
          acknowledgment: "",
          /** Images beside specific notes (author name must match ## line in embedded-notes.js). */
          noteSidePhotos: {
            Varsha: { src: "photos/liberty.jpg", alt: "Liberty game outing" },
            Paula: { src: "photos/contracting.png", alt: "Contracting" },
          },
        };

        function parseNotesBlock(noteBlock) {
          var notes = [];
          var chunks = String(noteBlock || "")
            .replace(/^\uFEFF/, "")
            .trim()
            .split(/^##\s+/m)
            .filter(function (p) {
              return p.trim();
            });
          chunks.forEach(function (chunk) {
            var i = chunk.indexOf("\n");
            if (i === -1) return;
            var from = chunk.slice(0, i).trim();
            var text = chunk.slice(i + 1).trim();
            if (from && text) notes.push({ from: from, text: text });
          });
          return notes;
        }

        function parseTeamSource(raw) {
          var photos = [];
          raw = String(raw || "").replace(/^\uFEFF/, "");
          var beforeNotes = raw.split(/===\s*NOTES\s*===/i)[0];
          var photoBlock = beforeNotes.replace(/===\s*PHOTOS\s*===/i, "").trim();

          photoBlock.split(/\r?\n/).forEach(function (line) {
            var t = line.trim();
            if (!t || t[0] === "#" || /^===/.test(t)) return;
            var parts = t.split("|").map(function (s) {
              return s.trim();
            });
            if (parts[0]) photos.push({ src: parts[0], alt: parts[1] || "", caption: parts[2] || "" });
          });

          return { photos: photos };
        }

        function embeddedNotesList() {
          var t = typeof window !== "undefined" && window.__FAREWELL_NOTES_BLOCK__;
          return t ? parseNotesBlock(t) : [];
        }

        function buildStatsSection(stats) {
          var main = document.getElementById("main");
          var anchor = (main && main.querySelector(".panel--photos")) || (main && main.querySelector(".panel--hero"));
          if (!main || !anchor) return;
          var existing = document.getElementById("statsPanel");
          if (existing) existing.remove();
          var sec = document.createElement("section");
          sec.id = "statsPanel";
          sec.className = "panel panel--stats";
          sec.setAttribute("data-theme", "ocean");
          var grid = document.createElement("div");
          grid.className = "stats-grid";
          stats.forEach(function (_, index) {
            var d = 0.06 + index * 0.08;
            var block = document.createElement("article");
            block.className = "stat-block";
            block.setAttribute("data-stat", String(index));
            block.innerHTML =
              '<p class="stat-rank reveal" style="--d: ' +
              d +
              's" data-field="rank"></p>' +
              '<p class="stat-label reveal" style="--d: ' +
              (d + 0.06) +
              's" data-field="label"></p>' +
              '<p class="stat-number reveal" style="--d: ' +
              (d + 0.12) +
              's" data-field="value"></p>' +
              '<p class="stat-suffix reveal" style="--d: ' +
              (d + 0.18) +
              's" data-field="suffix"></p>' +
              '<p class="stat-foot reveal" style="--d: ' +
              (d + 0.24) +
              's" data-field="footnote"></p>';
            grid.appendChild(block);
          });
          sec.appendChild(grid);
          anchor.insertAdjacentElement("afterend", sec);
        }

        function applyPage(p) {
          if (p.pageTitle) document.title = p.pageTitle;
          document.querySelector('[data-bind="topBarLeft"]').textContent = p.topBar.left;
          document.querySelector('[data-bind="topBarRight"]').textContent = p.topBar.right;
          var heroTitleEl = document.getElementById("heroTitle");
          if (heroTitleEl) heroTitleEl.innerHTML = p.heroTitleHtml || "";
          document.querySelector('[data-bind="heroLede"]').textContent = p.heroLede;
          document.querySelector('[data-bind="finaleLede"]').textContent = p.finale.lede;
          document.getElementById("confettiBtn").textContent = p.finale.buttonLabel;
          document.querySelector('[data-bind="finaleSignoff"]').textContent = p.finale.signoff;
          var credit = document.querySelector('[data-bind="creditLine"]');
          if (p.acknowledgment && String(p.acknowledgment).trim()) {
            credit.textContent = String(p.acknowledgment).trim();
            credit.hidden = false;
          } else {
            credit.textContent = "";
            credit.hidden = true;
          }

          p.stats.forEach(function (stat, index) {
            var panel = document.querySelector("#statsPanel [data-stat=\"" + index + "\"]");
            if (!panel) return;
            panel.querySelector('[data-field="rank"]').textContent = stat.rank;
            panel.querySelector('[data-field="label"]').textContent = stat.label;
            panel.querySelector('[data-field="suffix"]').textContent = stat.suffix;
            var footEl = panel.querySelector('[data-field="footnote"]');
            var foot = stat.footnote && String(stat.footnote).trim();
            footEl.textContent = foot || "";
            footEl.hidden = !foot;
            var valueEl = panel.querySelector('[data-field="value"]');
            valueEl.removeAttribute("data-count");
            valueEl.classList.remove("stat-number--small");
            if (stat.value.kind === "count") {
              valueEl.textContent = "0";
              valueEl.setAttribute("data-count", String(stat.value.count));
            } else {
              valueEl.textContent = stat.value.text;
              if (stat.value.text.length <= 6) valueEl.classList.add("stat-number--small");
            }
          });
        }

        function renderPhotos(items) {
          var grid = document.getElementById("photoGrid");
          grid.innerHTML = "";
          var list = items.length
            ? items
            : [
                { src: "", alt: "", caption: "" },
                { src: "", alt: "", caption: "" },
              ];
          list.forEach(function (item, i) {
            var fig = document.createElement("figure");
            fig.className = "photo-card reveal";
            fig.style.setProperty("--d", 0.08 + i * 0.1 + "s");
            if (item.src) {
              var img = document.createElement("img");
              img.className = "photo-card__img";
              img.src = item.src;
              img.alt = item.alt || "";
              fig.appendChild(img);
            } else {
              var ph = document.createElement("div");
              ph.className = "photo-card__ph";
              ph.setAttribute("role", "img");
              if (item.alt) ph.setAttribute("aria-label", item.alt);
              fig.appendChild(ph);
            }
            var capText = (item.caption && String(item.caption).trim()) || "";
            if (capText) {
              var cap = document.createElement("figcaption");
              cap.textContent = capText;
              fig.appendChild(cap);
            }
            grid.appendChild(fig);
          });
        }

        function renderNotes(items, sidePhotoMap) {
          var host = document.getElementById("notesLetters");
          if (!host) return;
          sidePhotoMap = sidePhotoMap || {};
          host.innerHTML = "";
          var list = items.length
            ? items
            : [
                {
                  from: "Setup",
                  text:
                    "No notes found. Add the teammate block to embedded-notes.js (see window.__FAREWELL_NOTES_BLOCK__).",
                },
              ];
          list.forEach(function (n, i) {
            var media = sidePhotoMap[n.from];
            var hasMedia = media && media.src;
            var art = document.createElement("article");
            art.className = "note-letter reveal" + (hasMedia ? " note-letter--with-media" : "");
            art.style.setProperty("--d", 0.06 + Math.min(i, 8) * 0.05 + "s");
            var h = document.createElement("h3");
            h.className = "note-letter__from";
            h.textContent = n.from;
            h.setAttribute("aria-label", "Note from " + n.from);
            var body = document.createElement("div");
            body.className = "note-letter__body";
            var p = document.createElement("p");
            p.className = "note-letter__text";
            p.textContent = n.text;
            body.appendChild(p);
            art.appendChild(h);
            if (hasMedia) {
              var row = document.createElement("div");
              row.className = "note-letter__row";
              var fig = document.createElement("figure");
              fig.className = "note-letter__figure";
              var img = document.createElement("img");
              img.className = "note-letter__img";
              img.src = media.src;
              img.alt = media.alt || "";
              img.setAttribute("loading", "lazy");
              fig.appendChild(img);
              row.appendChild(body);
              row.appendChild(fig);
              art.appendChild(row);
            } else {
              art.appendChild(body);
            }
            host.appendChild(art);
          });
        }

        function initReveals() {
          var prefers = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (prefers) {
            document.querySelectorAll(".reveal").forEach(function (el) {
              el.classList.add("is-visible");
            });
            return;
          }
          var obs = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (e) {
                if (e.isIntersecting) e.target.classList.add("is-visible");
              });
            },
            { threshold: 0.08, rootMargin: "0px 0px -4% 0px" }
          );
          document.querySelectorAll(".reveal").forEach(function (el) {
            obs.observe(el);
          });
        }

        function initStatCounts() {
          var prefers = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          document.querySelectorAll("#statsPanel .stat-block").forEach(function (block) {
            var numEl = block.querySelector("[data-count]");
            if (!numEl || prefers) return;
            var target = parseInt(numEl.getAttribute("data-count") || "0", 10);
            if (!isFinite(target)) return;
            var done = false;
            var io = new IntersectionObserver(function (entries) {
              entries.forEach(function (entry) {
                if (!entry.isIntersecting || done) return;
                done = true;
                numEl.dataset.animated = "1";
                var start = performance.now();
                var dur = 1400;
                function tick(now) {
                  var t = Math.min(1, (now - start) / dur);
                  var eased = 1 - Math.pow(1 - t, 3);
                  numEl.textContent = Math.round(eased * target).toLocaleString();
                  if (t < 1) requestAnimationFrame(tick);
                }
                requestAnimationFrame(tick);
                io.disconnect();
              });
            }, { threshold: 0.35 });
            io.observe(block);
          });
        }

        function initConfetti() {
          var canvas = document.getElementById("confetti");
          var btn = document.getElementById("confettiBtn");
          if (!canvas || !btn) return;
          var ctx = canvas.getContext("2d");
          if (!ctx) return;
          var prefers = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          function resize() {
            var dpr = window.devicePixelRatio || 1;
            var w = window.innerWidth;
            var h = window.innerHeight;
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            canvas.style.width = w + "px";
            canvas.style.height = h + "px";
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          }
          resize();
          window.addEventListener("resize", resize);
          var colors = [
            "#00a8e2",
            "#22d3ee",
            "#14b8a6",
            "#67e8f9",
            "#a5b4fc",
            "#fde68a",
            "#ffffff",
          ];
          var pieces = [];
          var animating = false;
          function loop() {
            var w = window.innerWidth;
            var h = window.innerHeight;
            ctx.clearRect(0, 0, w, h);
            pieces = pieces.filter(function (p) {
              return p.life > 0;
            });
            pieces.forEach(function (p) {
              p.vy += 0.18;
              p.x += p.vx;
              p.y += p.vy;
              p.rot += p.vr;
              p.life -= 0.008;
              ctx.save();
              ctx.translate(p.x, p.y);
              ctx.rotate(p.rot);
              ctx.globalAlpha = Math.max(0, p.life);
              ctx.fillStyle = p.color;
              ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
              ctx.restore();
            });
            if (pieces.length) requestAnimationFrame(loop);
            else animating = false;
          }
          btn.addEventListener("click", function () {
            if (prefers) return;
            var w = window.innerWidth;
            var h = window.innerHeight;
            var cx = w / 2;
            var cy = h / 2;
            for (var i = 0; i < 140; i++) {
              var ang = Math.random() * Math.PI * 2;
              var sp = 6 + Math.random() * 10;
              pieces.push({
                x: cx,
                y: cy,
                vx: Math.cos(ang) * sp,
                vy: Math.sin(ang) * sp - 4,
                rot: Math.random() * Math.PI,
                vr: (Math.random() - 0.5) * 0.35,
                w: 6 + Math.random() * 8,
                h: 10 + Math.random() * 12,
                color: colors[(Math.random() * colors.length) | 0],
                life: 1,
              });
            }
            if (!animating) {
              animating = true;
              loop();
            }
          });
        }

        buildStatsSection(PAGE.stats);
        applyPage(PAGE);

        function initSlideKeys() {
          var step = function () {
            return window.innerHeight || 600;
          };
          window.addEventListener(
            "keydown",
            function (e) {
              var tag = (e.target && e.target.tagName) || "";
              if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.isComposing) return;
              if (e.key === " " || e.key === "PageDown") {
                e.preventDefault();
                window.scrollBy({ top: step(), left: 0, behavior: "smooth" });
              } else if (e.key === "PageUp") {
                e.preventDefault();
                window.scrollBy({ top: -step(), left: 0, behavior: "smooth" });
              }
            },
            { passive: false }
          );
        }

        function bootContent() {
          renderNotes(embeddedNotesList(), PAGE.noteSidePhotos);
          initReveals();
          initStatCounts();
          initConfetti();
          initSlideKeys();
        }

        var standalonePhotos = window.__STANDALONE_PHOTOS__;
        if (standalonePhotos && standalonePhotos.length) {
          renderPhotos(standalonePhotos);
          bootContent();
        } else {
          fetch(TEAM_SRC, { cache: "no-store" })
            .then(function (r) {
              return r.ok ? r.text() : Promise.reject();
            })
            .then(function (text) {
              var parsed = parseTeamSource(text);
              renderPhotos(parsed.photos);
              bootContent();
            })
            .catch(function () {
              renderPhotos([]);
              bootContent();
            });
        }
      })();
    </script>
  </body>
</html>
